<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Dynamics Lab - Hydrogen Diffusion</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        /* Centralized Theme Token System */
        :root { 
            --accent: #E10600; 
            --panel: #0A0A0A; 
            --border: #222; 
            --cyan: #00f2ff; 
            --bg-body: #000000;
            --bg-wrapper: #050505;
            --bg-canvas-fluid: #050505;
            --bg-canvas-slab: #16181d;
            --bg-canvas-oxide: #000000;
            --grain-color: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-label: #888888;
            --text-brand: #00f2ff;
            --btn-bg: #222222;
            --btn-text: #cccccc;
            --btn-mode-border: #ffffff;
            --btn-mode-hover: #00CC66;
            --toggle-bg: #111111;
            --toggle-border: #333333;
        }

        [data-theme="light"] {
            --panel: #ffffff; 
            --border: #dddddd; 
            --cyan: #007a8c;
            --bg-body: #f0f2f5;
            --bg-wrapper: #ffffff;
            --bg-canvas-fluid: #f5f7fa;
            --bg-canvas-slab: #e2e8f0;
            --bg-canvas-oxide: #cbd5e1;
            --grain-color: rgba(0, 0, 0, 0.12);
            --text-main: #111111;
            --text-label: #555555;
            --text-brand: #007a8c; /* Enhanced contrast variant for clarity */
            --btn-bg: #eaeaea;
            --btn-text: #444444;
            --btn-mode-border: #333333;
            --btn-mode-hover: #00994d;
            --toggle-bg: #f0f0f0;
            --toggle-border: #cccccc;
        }

        body {
            margin: 0;
            padding: 20px;
            background: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s ease;
        }

        #wrapper-div {
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            border: 1px solid var(--border);
            background: var(--bg-wrapper);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        #sim-container { 
            display: flex; 
            height: 100%; 
            gap: 10px; 
            padding: 10px; 
            font-family: 'Inter', sans-serif; 
            box-sizing: border-box; 
        }

        .sidebar { 
            width: 280px; 
            background: var(--panel); 
            border: 1px solid var(--border); 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 22px; 
            overflow-y: auto; 
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .canvas-area { 
            flex: 1; 
            position: relative; 
            border: 1px solid var(--border); 
            background: var(--bg-canvas-fluid); 
            border-radius: 4px; 
            overflow: hidden; 
            transition: border-color 0.3s ease;
        }

        #simCanvas { 
            width: 100%; 
            height: 100%; 
            cursor: crosshair; 
            display: block; 
        }

        .control-group { display: flex; flex-direction: column; gap: 8px; }

        label { 
            color: var(--text-label); 
            font-size: 11px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            transition: color 0.3s ease;
        }

        input[type="range"] { 
            width: 100%; 
            accent-color: var(--accent); 
            cursor: pointer; 
        }

        input[type="range"]:disabled { opacity: 0.3; cursor: not-allowed; }

        .readout { 
            font-family: monospace; 
            color: var(--accent); 
            font-size: 14px; 
            text-align: right; 
            font-weight: 700; 
            letter-spacing: 1px; 
            min-height: 1.2em; 
        }

        .action-btn { 
            padding: 12px; 
            border-radius: 4px; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            cursor: pointer; 
            transition: all 0.2s; 
            border: none; 
            font-size: 12px; 
        }

        #pauseBtn { background: var(--accent); color: white; }
        #heatModeBtn { background: var(--btn-bg); color: #cc0000; border: 1px solid #440000; }
        #heatModeBtn.active { background: #cc0000; color: white; box-shadow: 0 0 10px rgba(204,0,0,0.5); }
        
        #modeBtn { background: var(--btn-bg); color: var(--text-main); border: 1px solid var(--btn-mode-border); margin-bottom: -10px; }
        #modeBtn:hover { color: var(--btn-mode-hover); border-color: var(--btn-mode-hover); }
        #resetBtn { background: var(--btn-bg); color: var(--btn-text); }

        #themeToggleBtn {
            background: var(--toggle-bg);
            color: var(--text-main);
            border: 1px solid var(--toggle-border);
            margin-bottom: -5px;
        }
    </style>
</head>
<body>

<div id="wrapper-div">
    <div id="sim-container">
        <div class="sidebar">
            <div id="brand-heading" style="font-weight: 900; color: var(--text-brand); letter-spacing: 2px; font-size: 14px; transition: color 0.3s ease;">Process Dynamics Lab</div>
            <button id="themeToggleBtn" class="action-btn">Light/Dark Mode</button>
            <button id="modeBtn" class="action-btn">Mode: Gas Phase</button>
            
            <div class="control-group">
                <label id="input-label">H<sub>2</sub> Pressure</label>
                <input type="range" id="pRange" min="0.0" max="2.0" step="0.01" value="0.5">
                <div class="readout" id="p-readout"></div>
            </div>
            <div class="control-group">
                <label>H Diffusion Rate</label>
                <input type="range" id="dRange" min="1" max="500" step="1" value="70">
                <div class="readout" id="d-readout"></div>
            </div>
            <div class="control-group">
                <label>Temperature</label>
                <input type="range" id="tRange" min="300" max="1200" step="10" value="300">
                <div class="readout" id="t-readout"></div>
                <button id="heatModeBtn" class="action-btn" style="margin-top:5px; font-size:10px;">Thermal Desorption</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
                <button id="pauseBtn" class="action-btn">Pause</button>
                <button id="resetBtn" class="action-btn">Reset</button>
            </div>
            <div style="margin-top: auto; border-top: 1px solid var(--border); padding-top: 15px; transition: border-color 0.3s ease;">
                <label>Status</label>
                <div id="status-text" style="color: #0C6; font-size: 12px; margin-top: 5px; font-weight: bold;">SYSTEM NOMINAL</div>
            </div>
        </div>
        <div class="canvas-area"><canvas id="simCanvas"></canvas></div>
    </div>

    <script>
    (function() {
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const pSlider = document.getElementById('pRange'), dSlider = document.getElementById('dRange'), tSlider = document.getElementById('tRange');
        const pReadout = document.getElementById('p-readout'), dReadout = document.getElementById('d-readout'), tReadout = document.getElementById('t-readout');
        const resetBtn = document.getElementById('resetBtn'), pauseBtn = document.getElementById('pauseBtn'), heatModeBtn = document.getElementById('heatModeBtn'), modeBtn = document.getElementById('modeBtn'), themeToggleBtn = document.getElementById('themeToggleBtn');

        const dpr = window.devicePixelRatio || 1;
        let W, H, heatMode = false, isPaused = false, isElectrolytic = false;
        let desorptionCompleteFlag = false;
        
        const surfaceX = 240;
        const slabWidth = 14;
        const hRadius = 7; 

        let grains = [], molecules = [], atoms = [];

        function resize() {
            const rect = canvas.getBoundingClientRect();
            W = rect.width; H = rect.height;
            canvas.width = W * dpr; canvas.height = H * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize); resize();

        function toggleSliders(disabled) {
            pSlider.disabled = disabled;
            dSlider.disabled = disabled;
            tSlider.disabled = disabled;
        }

        function drawSphere(x, y, r, c1, c2, c3, isH = false) {
            ctx.save();
            let g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
            
            const isLightMode = document.documentElement.getAttribute('data-theme') === 'light';

            if (isH) {
                if (isLightMode) {
                    g.addColorStop(0, '#ff4d4d'); 
                    g.addColorStop(1, '#660000'); // Higher localized lightness baseline for visibility against white
                } else {
                    g.addColorStop(0, '#ff3333'); 
                    g.addColorStop(1, '#200000');
                }
            } else {
                g.addColorStop(0, c1); 
                g.addColorStop(0.7, c2); 
                g.addColorStop(1, c3);
            }
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = isLightMode ? 'rgba(0, 0, 0, 0.15)' : 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 0.5;
            ctx.stroke();
            ctx.restore();
        }

        const drawH = (x, y, r) => drawSphere(x, y, r, null, null, null, true);
        const drawS = (x, y, r) => drawSphere(x, y, r, '#ffd700', '#aa8800', '#443300');
        const drawO = (x, y, r) => drawSphere(x, y, r, '#ffffff', '#cccccc', '#666666');

        class HIon {
            constructor(x = -50, y = Math.random()*H) { 
                this.x = x; this.y = y; 
                this.vx = 4.0+Math.random()*4; 
                this.vy = (Math.random()-0.5)*5; 
            }
            update(p, therm) {
                const b = (heatMode || desorptionCompleteFlag) ? (20.0 + therm * 35) : (5 + therm * 12);
                this.x += (Math.random()-0.5)*b; this.y += (Math.random()-0.5)*b;
                if (!heatMode && !isPaused && !desorptionCompleteFlag) {
                    this.x += this.vx * (1 + p); this.y += this.vy;
                    if (this.x >= surfaceX) {
                        if (Math.random() < p * 0.8) { 
                            atoms.push(new HAtom(surfaceX + 1, this.y)); 
                            this.x = -60; 
                        } else { 
                            this.vx = -Math.abs(this.vx); this.x = surfaceX - 1; 
                        }
                    }
                }
                if (this.x > surfaceX) this.x = surfaceX - 1; 
                if (this.x < -150) { this.x = -50; this.vx = Math.abs(this.vx); }
                if (this.y < 0) this.y = H; if (this.y > H) this.y = 0; return true;
            }
            draw() { drawH(this.x, this.y, hRadius); }
        }

        class HSO4Anion {
            constructor(x = -50, y = Math.random()*H) { 
                this.x = x; this.y = y; 
                this.vx = 2.5+Math.random()*3; 
                this.vy = (Math.random()-0.5)*4; 
                this.rot = Math.random()*6.28; 
            }
            update(p, therm) {
                const b = (heatMode || desorptionCompleteFlag) ? (10.0 + therm * 25) : (2.0 + therm * 10);
                this.x += (Math.random()-0.5)*b; this.y += (Math.random()-0.5)*b;
                if (!heatMode && !isPaused && !desorptionCompleteFlag) {
                    this.x += this.vx * (1 + p); this.y += this.vy;
                }
                this.rot += 0.08 + (therm * ((heatMode || desorptionCompleteFlag) ? 0.8 : 0.25));
                if (this.x >= surfaceX) { 
                    this.vx = -Math.abs(this.vx); 
                    this.x = surfaceX - 1; 
                }
                if (this.x < -150) { this.x = -50; this.vx = Math.abs(this.vx); }
                if (this.y < 0) this.y = H; if (this.y > H) this.y = 0; return true;
            }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot);
                drawS(0, 0, 9); 
                [[8,8],[-8,8],[8,-8],[-8,-8]].forEach(pos => drawO(pos[0], pos[1], 5)); 
                drawH(12, 0, hRadius); 
                ctx.restore();
            }
        }

        class H2Molecule {
            constructor(x = -60, y = Math.random() * H, vx = null) { 
                this.x = x; this.y = y;
                this.vx = vx || 2.0 + Math.random() * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.15;
            }
            update(p) {
                this.x += this.vx * (1 + p); this.y += this.vy;
                this.rotation += this.rotSpeed;
                if (this.vx > 0 && this.x >= surfaceX) {
                    if (!heatMode && Math.random() < p * 0.7) { 
                        atoms.push(new HAtom(surfaceX + slabWidth + 1, this.y));
                        this.x = -60; this.vx = 2.0 + Math.random() * 2.5;
                    } else {
                        this.vx = -Math.abs(this.vx); this.x = surfaceX - 1;
                    }
                }
                return !(this.x < -100 || this.y < -20 || this.y > H + 20);
            }
            draw() {
                const ox = Math.cos(this.rotation) * 6;
                const oy = Math.sin(this.rotation) * 6;
                drawH(this.x - ox, this.y - oy, hRadius);
                drawH(this.x + ox, this.y + oy, hRadius);
            }
        }

        class HAtom {
            constructor(x, y) { 
                this.x = x; this.y = y; 
                this.stuck = false; 
                this.jitterX = 0; this.jitterY = 0; 
            }
            update() {
                const spd = parseFloat(dSlider.value) / 10;
                let temp = parseInt(tSlider.value);
                const thermalIntensity = Math.pow((temp - 300) / 900, 2);
                const escapeProb = 0.01 + thermalIntensity * 0.4;
                this.jitterX = (Math.random() - 0.5) * thermalIntensity * 12;
                this.jitterY = (Math.random() - 0.5) * thermalIntensity * 12;
                const currentEntryX = isElectrolytic ? surfaceX : (surfaceX + slabWidth);
                if (!this.stuck) {
                    const drift = heatMode ? (isElectrolytic ? -3.0 : -1.5) * thermalIntensity : (-0.2 * thermalIntensity);
                    this.x += ((Math.random() - 0.5) * spd * 6) + drift;
                    this.y += (Math.random() - 0.5) * spd * 6;
                    if (this.x < currentEntryX) {
                         if (Math.random() < escapeProb || heatMode) {
                             if (this.x < surfaceX) {
                                 if(isElectrolytic) molecules.push(new HIon(surfaceX - 1, this.y));
                                 else molecules.push(new H2Molecule(surfaceX - 1, this.y, -3 - Math.random() * 2));
                                 return false; 
                             }
                         } else { this.x = currentEntryX + 0.1; }
                    }
                    if (this.x > W) this.x = W - 0.1;
                    if (this.y < 0) this.y = 0.1;
                    if (this.y > H) this.y = H - 0.1;
                    if (!heatMode && (getGBDist(this.x, this.y) < 5.0 || Math.abs(this.x - currentEntryX) < 5.0)) {
                        this.stuck = true;
                    }
                } else {
                    if (heatMode || Math.random() < escapeProb) {
                        this.stuck = false;
                        this.x -= isElectrolytic ? (4 + thermalIntensity * 6) : 3;
                    }
                }
                return true;
            }
            draw() { drawH(this.x + this.jitterX, this.y + this.jitterY, hRadius); }
        }

        function getGBDist(x, y) {
            let d1 = Infinity, d2 = Infinity;
            for (let g of grains) { let d = Math.hypot(g.x-x, g.y-y); if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) d2 = d; }
            return d2-d1;
        }

        function init() {
            grains = Array.from({length: 15}, () => ({ x: surfaceX+Math.random()*(W-surfaceX), y: Math.random()*H }));
            molecules = []; atoms = []; desorptionCompleteFlag = false; 
            toggleSliders(false);
            pauseBtn.innerText = isPaused ? "Resume" : "Pause";
            updateMolecules(); updateLabels();
        }

        function updateLabels() {
            const checkLabel = (slider, readout) => {
                const val = parseFloat(slider.value);
                if (val === parseFloat(slider.min)) readout.innerText = "MIN";
                else if (val === parseFloat(slider.max)) readout.innerText = "MAX";
                else readout.innerText = "";
            };
            checkLabel(pSlider, pReadout); checkLabel(dSlider, dReadout); checkLabel(tSlider, tReadout);
        }

        function updateMolecules() {
            const p = parseFloat(pSlider.value);
            if (heatMode && !isElectrolytic) { molecules = []; return; }
            let target = isElectrolytic ? Math.floor(15+(p/2)*55) : Math.floor(2 + (p / 2.0) * 28);
            while(molecules.length < target) {
                if(isElectrolytic) molecules.push(Math.random()>0.4 ? new HIon() : new HSO4Anion());
                else molecules.push(new H2Molecule());
            }
        }

        modeBtn.onclick = () => {
            isElectrolytic = !isElectrolytic; modeBtn.innerText = isElectrolytic ? "Mode: Electrolytic" : "Mode: Gas Phase";
            document.getElementById('input-label').innerHTML = isElectrolytic ? "Cathodic Potential" : "H<sub>2</sub> Pressure";
            init();
        };

        themeToggleBtn.onclick = () => {
            if (document.documentElement.getAttribute('data-theme') === 'light') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        };

        function loop() {
            // Read active computing colors directly from runtime style metrics
            const style = getComputedStyle(document.body);
            
            ctx.fillStyle = style.getPropertyValue('--bg-canvas-fluid').trim(); 
            ctx.fillRect(0, 0, W, H);
            
            ctx.fillStyle = style.getPropertyValue('--bg-canvas-slab').trim(); 
            ctx.fillRect(surfaceX, 0, W-surfaceX, H);
            
            ctx.fillStyle = style.getPropertyValue('--grain-color').trim();
            let startAt = isElectrolytic ? surfaceX : (surfaceX + slabWidth);
            for (let i = startAt + 10; i < W; i += 5) {
                for (let j = 0; j < H; j += 5) if (getGBDist(i, j) < 2.5) ctx.fillRect(i, j, 3, 3);
            }
            if(!isElectrolytic) { 
                ctx.fillStyle = style.getPropertyValue('--bg-canvas-oxide').trim(); 
                ctx.fillRect(surfaceX, 0, slabWidth, H); 
            }
            
            const therm = Math.pow((parseInt(tSlider.value)-300)/900, 2);
            const p = parseFloat(pSlider.value);
            if (heatMode && atoms.length === 0) {
                if (isElectrolytic || molecules.length === 0) {
                    heatMode = false;
                    desorptionCompleteFlag = true;
                    toggleSliders(true);
                    heatModeBtn.classList.remove('active');
                    document.getElementById('status-text').innerText = "DESORPTION COMPLETE";
                    document.getElementById('status-text').style.color = "#E10600";
                    pauseBtn.innerText = "Resume";
                    if (!isElectrolytic) isPaused = true; 
                }
            }
            if (heatMode && !isPaused && !isElectrolytic) {
                let curT = parseInt(tSlider.value);
                if (curT < 1200) { tSlider.value = curT + 2; updateLabels(); }
            }
            if (!isPaused || (isElectrolytic && desorptionCompleteFlag)) {
                if (isElectrolytic) {
                    molecules.forEach(m => m.update(p, therm));
                } else {
                    if (!heatMode && !desorptionCompleteFlag && molecules.length < Math.floor(2 + (p / 2.0) * 28)) updateMolecules();
                    molecules = molecules.filter(m => m.update(p));
                }
            }
            if (!isPaused && !desorptionCompleteFlag) {
                atoms = atoms.filter(a => a.update());
            }
            molecules.forEach(m => m.draw()); 
            atoms.forEach(a => a.draw());
            requestAnimationFrame(loop);
        }

        pauseBtn.onclick = () => { 
            if (desorptionCompleteFlag) {
                desorptionCompleteFlag = false;
                isPaused = false;
                toggleSliders(false);
                document.getElementById('status-text').innerText = "SYSTEM NOMINAL";
                document.getElementById('status-text').style.color = "#0C6";
                pauseBtn.innerText = "Pause";
                return;
            }
            isPaused = !isPaused; 
            pauseBtn.innerText = isPaused ? "Resume" : "Pause";
            if (!isPaused) {
                document.getElementById('status-text').innerText = "SYSTEM NOMINAL";
                document.getElementById('status-text').style.color = "#0C6";
            }
        };
        resetBtn.onclick = init;
        heatModeBtn.onclick = () => { 
            heatMode = !heatMode; 
            if (heatMode) {
                isPaused = false; 
            }
            desorptionCompleteFlag = false;
            toggleSliders(false);
            pauseBtn.innerText = isPaused ? "Resume" : "Pause";
            heatModeBtn.classList.toggle('active'); 
            document.getElementById('status-text').innerText = heatMode ? "THERMAL DESORPTION" : "SYSTEM NOMINAL";
            document.getElementById('status-text').style.color = heatMode ? "#cc0000" : "#0C6";
            updateMolecules(); 
        };
        pSlider.oninput = () => { if(!desorptionCompleteFlag) { updateLabels(); updateMolecules(); } };
        dSlider.oninput = () => { if(!desorptionCompleteFlag) updateLabels(); };
        tSlider.oninput = () => { if(!desorptionCompleteFlag) updateLabels(); };
        init(); loop();
    })();
    </script>
</div>

</body>
</html>
