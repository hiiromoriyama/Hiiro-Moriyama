<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fe-H Advanced Dynamics - Simulation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { 
            margin:0; padding:0; background:#000; overflow:hidden; 
            font-family: 'Inter', sans-serif; color: #eee; user-select: none;
            width: 100vw; height: 100vh;
        }

        #container { display: flex; flex-direction: row; width: 100%; height: 100%; background: #000; }

        #ui-panel { 
            width: 170px; min-width: 170px; height: 100%; 
            background: #0d0d0d; border-right: 2px solid #333; 
            padding: 12px; display: flex; flex-direction: column; 
            gap: 10px; box-sizing: border-box; z-index: 100; overflow-y: auto;
        }

        #c { flex-grow: 1; height: 100%; display: block; background: #000; }

        #overlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); z-index: 1001;
            display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer;
        }

        .control { display: flex; flex-direction: column; gap: 3px; width: 100%; }
        .control label { font-size: 8px; color: #00e5ff; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .legend { margin-top: 5px; padding-top: 8px; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 4px; }
        .stat-item { font-size: 9px; font-weight: 900; text-transform: uppercase; color: #aaa; }
        .stat-val { color: #eee; float: right; }
        #abs-val { color: #00ff66; }
        #h-val { color: #ff4444; }

        button#play-pause { 
            background: #222; color: #00e5ff; border: 1px solid #00e5ff; padding: 8px; width: 100%;
            cursor: pointer; font-size: 18px; border-radius: 4px; transition: 0.2s;
        }
        button#play-pause:hover { background: #00e5ff; color: #000; }

        select { background: #222; color: #eee; border: 1px solid #444; font-size: 9px; padding: 3px; border-radius: 3px; width: 100%; }
        input[type=range] { appearance: none; background: #333; height: 2px; width: 100%; margin: 4px 0; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 10px; height: 10px; background: #00e5ff; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>
    <div id="overlay" onclick="startSim()">
        <h2 style="font-weight:900; color:#00e5ff; letter-spacing:5px;">CORE INITIALIZATION</h2>
        <p style="font-size:10px; color:#555;">CLICK TO ACTIVATE SYSTEM</p>
    </div>
    <div id="container">
        <div id="ui-panel">
            <button id="play-pause" onclick="togglePause()">⏯</button>
            
            <div class="control">
                <label>Emission Mode</label>
                <select id="emit-mode" onchange="emitMode=this.value">
                    <option value="pulse">Discrete Pulse</option>
                    <option value="cont">Continuous</option>
                </select>
            </div>

            <div class="control"><label>Mean Free Path</label><input type="range" id="mfp" min="100" max="1000" step="50" value="400" oninput="lambda_k=parseFloat(this.value)"></div>
            <div class="control"><label>Electron Size</label><input type="range" id="e-size" min="2" max="15" step="1" value="5" oninput="particleBaseR=parseFloat(this.value)"></div>
            <div class="control"><label>Thermal (σ²)</label><input type="range" id="thermal" min="0" max="8" step="0.5" value="1" oninput="thermalK=this.value"></div>
            <div class="control"><label>Fe Volume</label><input type="range" id="fe-vol" min="10" max="35" value="20" oninput="feSize=this.value; generateLattice()"></div>
            <div class="control"><label>H Concentration</label><input type="range" id="h-conc" min="0" max="100" value="15" oninput="hConc=this.value; generateLattice()"></div>
            <div class="control"><label>Frequency</label><input type="range" id="emit-freq" min="1" max="60" value="10" oninput="emitFreq=this.value"></div>
            <div class="control"><label>Velocity (k)</label><input type="range" id="vel" min="1" max="10" step="0.5" value="4" oninput="speedFactor=this.value"></div>

            <div class="legend">
                <div class="stat-item">Impacts <span class="stat-val" id="b-count">0</span></div>
                <div class="stat-item">Absorbed <span class="stat-val" id="abs-val">0</span></div>
                <div class="stat-item">Fe Atoms <span class="stat-val" id="fe-val">0</span></div>
                <div class="stat-item">H Atoms <span class="stat-val" id="h-val">0</span></div>
            </div>
            <button onclick="resetSim()" style="margin-top:auto; background:#cc3300; color:#fff; border:none; padding:8px; font-size:9px; font-weight:900; cursor:pointer;">RESET</button>
        </div>
        <canvas id="c"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let atoms = [], hAtoms = [], particles = [];
        let isPaused = false, frame = 0, started = false;
        let feSize = 20, hConc = 15, emitFreq = 10, speedFactor = 4, lambda_k = 400, particleBaseR = 5, thermalK = 1, emitMode = 'pulse';
        let totalBounces = 0, totalAbsorbed = 0, emitter = null;
        const PX_PER_ANG = 35, LATTICE_A = 3.64; 

        function startSim() {
            if (started) return;
            started = true;
            document.getElementById('overlay').style.display = 'none';
            resize();
            draw();
        }

        class Atom {
            constructor(x, y, type = 'Fe') {
                this.baseX = x; this.baseY = y;
                this.x = x; this.y = y;
                this.vibeX = 0; this.vibeY = 0;
                this.type = type;
                this.r = type === 'Fe' ? 14 : 7;
                this.hitTime = -999;
                this.isEmitter = false;
            }
            updateVibe() {
                this.vibeX = (Math.random() - 0.5) * thermalK;
                this.vibeY = (Math.random() - 0.5) * thermalK;
            }
        }

        function generateLattice() {
            atoms = []; hAtoms = [];
            const dpr = window.devicePixelRatio || 1;
            const cx = (canvas.width / dpr) / 2;
            const cy = (canvas.height / dpr) / 2;
            const cells = Math.ceil(feSize / LATTICE_A / 2);

            for (let i = -cells; i <= cells; i++) {
                for (let j = -cells; j <= cells; j++) {
                    const ox = cx + i * LATTICE_A * PX_PER_ANG;
                    const oy = cy + j * LATTICE_A * PX_PER_ANG;
                    [[0,0], [0.5, 0.5], [0.5, 0], [0, 0.5]].forEach(p => {
                        atoms.push(new Atom(ox + p[0]*LATTICE_A*PX_PER_ANG, oy + p[1]*LATTICE_A*PX_PER_ANG, 'Fe'));
                    });
                }
            }

            const minX = Math.min(...atoms.map(a => a.x)), maxX = Math.max(...atoms.map(a => a.x));
            const minY = Math.min(...atoms.map(a => a.y)), maxY = Math.max(...atoms.map(a => a.y));
            
            for (let i = -cells; i <= cells; i++) {
                for (let j = -cells; j <= cells; j++) {
                    const hx = cx + i * LATTICE_A * PX_PER_ANG + 0.25 * LATTICE_A * PX_PER_ANG;
                    const hy = cy + j * LATTICE_A * PX_PER_ANG + 0.25 * LATTICE_A * PX_PER_ANG;
                    if(hx > minX && hx < maxX && hy > minY && hy < maxY && Math.random()*100 < hConc) {
                        hAtoms.push(new Atom(hx, hy, 'H'));
                    }
                }
            }

            // IRON-IRON DISTORTION PHYSICS (Lattice Strain)
            atoms.forEach(fe => {
                let dx_total = 0, dy_total = 0;
                hAtoms.forEach(h => {
                    const dx = fe.baseX - h.baseX, dy = fe.baseY - h.baseY;
                    const dist = Math.hypot(dx, dy);
                    if (dist < LATTICE_A * PX_PER_ANG * 0.9) {
                        const force = (LATTICE_A * PX_PER_ANG / dist) * 2.5;
                        dx_total += (dx / dist) * force;
                        dy_total += (dy / dist) * force;
                    }
                });
                fe.x = fe.baseX + dx_total;
                fe.y = fe.baseY + dy_total;
            });

            emitter = atoms.reduce((p, c) => Math.hypot(c.x-cx, c.y-cy) < Math.hypot(p.x-cx, p.y-cy) ? c : p);
            emitter.isEmitter = true;
            document.getElementById('fe-val').textContent = atoms.length;
            document.getElementById('h-val').textContent = hAtoms.length;
        }

        function update() {
            if (isPaused || !started) return;
            frame++;
            [...atoms, ...hAtoms].forEach(a => a.updateVibe());
            const interval = emitMode === 'pulse' ? Math.max(1, Math.floor(61 - emitFreq)) : 2;
            if (frame % interval === 0) {
                const angle = Math.random() * Math.PI * 2;
                particles.push({ x: emitter.x, y: emitter.y, vx: Math.cos(angle)*speedFactor, vy: Math.sin(angle)*speedFactor, b: 0, pathLength: 0, history: [], intensity: 1.0 });
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.history.unshift({x: p.x, y: p.y});
                if(p.history.length > 12) p.history.pop();
                p.pathLength += Math.hypot(p.vx, p.vy);
                p.intensity = Math.exp(-p.pathLength / lambda_k);
                p.x += p.vx; p.y += p.vy;
                for (let s of [...atoms, ...hAtoms]) {
                    const dx = p.x - (s.x + s.vibeX), dy = p.y - (s.y + s.vibeY), d = Math.hypot(dx, dy);
                    if (d < (particleBaseR/2) + s.r) {
                        const nx = dx/d, ny = dy/d, dot = p.vx*nx + p.vy*ny;
                        if (dot < 0) {
                            p.vx -= 2*dot*nx; p.vy -= 2*dot*ny;
                            s.hitTime = frame; p.b++; totalBounces++;
                        }
                    }
                }
                if (p.intensity < 0.01 || p.x < -100 || p.x > canvas.width + 100 || p.y < -100 || p.y > canvas.height + 100) {
                    particles.splice(i, 1);
                } else if (p.b > 0 && Math.hypot(p.x - emitter.x, p.y - emitter.y) < emitter.r + 5) {
                    totalAbsorbed++;
                    document.getElementById('abs-val').textContent = totalAbsorbed;
                    particles.splice(i, 1);
                }
            }
            document.getElementById('b-count').textContent = totalBounces;
        }

        function draw() {
            if (!started) return;
            const dpr = window.devicePixelRatio || 1;
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width/dpr, canvas.height/dpr);
            [...atoms, ...hAtoms].forEach(a => {
                const isHit = frame - a.hitTime < 10;
                const tx = a.x + a.vibeX, ty = a.y + a.vibeY;
                ctx.beginPath(); ctx.arc(tx, ty, a.r, 0, Math.PI*2);
                if (a.type === 'Fe') {
                    ctx.fillStyle = isHit ? '#fff' : '#444';
                } else {
                    ctx.fillStyle = isHit ? '#ffaaaa' : '#cc0000';
                }
                ctx.fill();
                if(a.isEmitter){ ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2; ctx.stroke(); }
            });
            particles.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, (particleBaseR/2) * p.intensity, 0, Math.PI*2);
                ctx.fillStyle = `rgba(0, 229, 255, ${p.intensity})`; ctx.fill();
            });
            update(); requestAnimationFrame(draw);
        }

        function togglePause() { isPaused = !isPaused; }
        function resetSim() { particles = []; totalBounces = 0; totalAbsorbed = 0; document.getElementById('abs-val').textContent = '0'; generateLattice(); }
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = (window.innerWidth - 170) * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            generateLattice();
        }
        window.addEventListener('resize', resize);
    </script>
</body>
</html>
