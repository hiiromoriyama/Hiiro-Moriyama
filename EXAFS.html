<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .ui { position: absolute; top: 0; left: 0; width: 100%; background: rgba(0,0,0,0.8); display: flex; padding: 10px; gap: 20px; border-bottom: 1px solid #333; }
        .ctrl { display: flex; flex-direction: column; color: #00e5ff; font-size: 10px; font-weight: bold; }
        label { margin-bottom: 3px; letter-spacing: 1px; }
        input[type=range] { width: 90px; cursor: pointer; }
        .stats { position: absolute; bottom: 10px; left: 15px; color: #666; font-size: 11px; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="ui">
        <div class="ctrl"><label>H-JUMP</label><input type="range" id="j" min="0" max="0.1" step="0.005" value="0.01"></div>
        <div class="ctrl"><label>THERMAL</label><input type="range" id="t" min="0" max="10" step="1" value="1"></div>
        <div class="ctrl"><label>H-CONC</label><input type="range" id="c_slider" min="0" max="80" step="5" value="15"></div>
        <button onclick="location.reload()" style="font-size: 10px; height: 25px; margin-top: 5px;">RESET</button>
    </div>
    <div class="stats">SYSTEM ACTIVE // BOUNCES: <span id="b">0</span></div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let atoms = [], hAtoms = [], sites = [];
        let jumpProb = 0.01, thermalK = 1, hConc = 15, bounces = 0;

        document.getElementById('j').oninput = e => jumpProb = parseFloat(e.target.value);
        document.getElementById('t').oninput = e => thermalK = parseFloat(e.target.value);
        document.getElementById('c_slider').oninput = e => { hConc = e.target.value; init(); };

        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            atoms = []; hAtoms = []; sites = [];
            const cx = canvas.width/2, cy = canvas.height/2, gap = 80;

            for(let i=-3; i<=3; i++) {
                for(let j=-2; j<=2; j++) {
                    let x = cx + i*gap, y = cy + j*gap;
                    atoms.push({x, y, r: 15});
                    sites.push({x: x + gap/2, y: y + gap/2});
                }
            }
            sites.forEach(s => {
                if(Math.random()*100 < hConc) hAtoms.push({x: s.x, y: s.y, bx: s.x, by: s.y});
            });
        }

        function draw() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0,0,canvas.width, canvas.height);

            // H-Jump Logic: Red atoms teleport to a random empty site
            hAtoms.forEach(h => {
                if(Math.random() < jumpProb) {
                    const s = sites[Math.floor(Math.random()*sites.length)];
                    h.bx = s.x; h.by = s.y;
                }
                ctx.beginPath();
                ctx.arc(h.bx + (Math.random()-0.5)*thermalK, h.by + (Math.random()-0.5)*thermalK, 6, 0, Math.PI*2);
                ctx.fillStyle = '#f00'; ctx.fill();
            });

            atoms.forEach(a => {
                ctx.beginPath();
                ctx.arc(a.x + (Math.random()-0.5)*thermalK, a.y + (Math.random()-0.5)*thermalK, 15, 0, Math.PI*2);
                ctx.fillStyle = '#444'; ctx.fill();
            });

            requestAnimationFrame(draw);
        }

        window.onresize = init;
        init(); draw();
    </script>
</body>
</html>
