<!DOCTYPE html>
<html>
<head>
    <style>
        /* This CSS ensures the simulation fills the iframe perfectly */
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        .ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.8); display: flex; padding: 10px;
            gap: 20px; border-bottom: 1px solid #333; z-index: 10;
        }
        .ctrl { display: flex; flex-direction: column; color: #00e5ff; font-size: 10px; font-weight: bold; }
        label { margin-bottom: 3px; letter-spacing: 1px; text-transform: uppercase; }
        input[type=range] { width: 85px; cursor: pointer; }
        
        .stats-bar {
            position: absolute; bottom: 10px; left: 15px;
            color: #666; font-size: 11px; letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="ui-overlay">
        <div class="ctrl">
            <label>H-Jump (Diffusion)</label>
            <input type="range" id="jump_slider" min="0" max="0.1" step="0.005" value="0.01">
        </div>
        <div class="ctrl">
            <label>Thermal Vibr.</label>
            <input type="range" id="thermal_slider" min="0" max="10" step="1" value="1">
        </div>
        <button onclick="location.reload()" style="font-size: 10px; height: 24px; margin-top: 5px; cursor: pointer;">RESET</button>
    </div>
    
    <div class="stats-bar">FE-H LATTICE DYNAMICS // ACTIVE</div>
    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let atoms = [], hAtoms = [], sites = [];
        let jumpProb = 0.01, thermalK = 1;

        document.getElementById('jump_slider').oninput = e => jumpProb = parseFloat(e.target.value);
        document.getElementById('thermal_slider').oninput = e => thermalK = parseFloat(e.target.value);

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            atoms = []; hAtoms = []; sites = [];
            const cx = canvas.width/2, cy = canvas.height/2, gap = 80;

            // Create 5x5 Iron (Fe) Lattice
            for(let i=-2; i<=2; i++) {
                for(let j=-2; j<=2; j++) {
                    let x = cx + i*gap, y = cy + j*gap;
                    atoms.push({x, y, r: 16});
                    // Define empty sites for Hydrogen to "Jump" into
                    sites.push({x: x + gap/2, y: y + gap/2});
                }
            }
            // Add initial Hydrogen (H) atoms
            sites.forEach(s => {
                if(Math.random() < 0.3) hAtoms.push({bx: s.x, by: s.y});
            });
        }

        function draw() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0,0,canvas.width, canvas.height);

            // Logic for Hydrogen Jumps
            hAtoms.forEach(h => {
                if(Math.random() < jumpProb) {
                    const target = sites[Math.floor(Math.random()*sites.length)];
                    h.bx = target.x; h.by = target.y;
                }
                ctx.beginPath();
                ctx.arc(h.bx + (Math.random()-0.5)*thermalK, h.by + (Math.random()-0.5)*thermalK, 6, 0, Math.PI*2);
                ctx.fillStyle = '#ff3333'; ctx.fill();
            });

            // Draw Iron Lattice
            atoms.forEach(a => {
                ctx.beginPath();
                ctx.arc(a.x + (Math.random()-0.5)*thermalK, a.y + (Math.random()-0.5)*thermalK, 16, 0, Math.PI*2);
                ctx.fillStyle = '#444'; ctx.fill();
            });

            requestAnimationFrame(draw);
        }

        window.onresize = init;
        init(); 
        draw();
    </script>
</body>
</html>
