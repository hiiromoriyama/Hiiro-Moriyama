<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        .controls { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; z-index: 10; }
        input { width: 100px; vertical-align: middle; }
        label { font-size: 12px; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="controls">
        <label>H-Conc:</label> <input type="range" id="hConc" min="0" max="20" value="5"><br>
        <label>Thermal:</label> <input type="range" id="thermal" min="0" max="10" value="2">
    </div>
    <script>
        let atoms = [];
        function setup() {
            createCanvas(windowWidth, windowHeight);
            for(let x=0; x<width; x+=50) {
                for(let y=0; y<height; y+=50) {
                    atoms.push({x: x+25, y: y+25, baseDim: 15});
                }
            }
        }

        function draw() {
            background(0, 15);
            let hVal = document.getElementById('hConc').value;
            let tVal = document.getElementById('thermal').value;

            // Outgoing Wave (The EXAFS "Source")
            noFill();
            stroke(0, 229, 255, 100);
            ellipse(width/2, height/2, (frameCount*2)%width);

            // Draw Atoms
            for(let a of atoms) {
                let d = dist(width/2, height/2, a.x, a.y);
                let jitter = random(-tVal, tVal);
                let strain = noise(a.x, a.y, frameCount*0.01) * hVal;
                
                fill(200);
                noStroke();
                ellipse(a.x + jitter + strain, a.y + jitter, 10, 10);
                
                // Backscattering wave
                if (d < (frameCount*2)%width && d > (frameCount*2)%width - 20) {
                    stroke(255, 100, 100, 150);
                    ellipse(a.x, a.y, 20);
                }
            }
        }
        function windowResized() { resizeCanvas(windowWidth, windowHeight); }
    </script>
</body>
</html>
